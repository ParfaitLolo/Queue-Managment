<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>Queue Management</title>

    <style>

        body {
            font-family: Arial, sans-serif;
        }

        .cameras {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .camera {
            width: 800px;
        }

        .video-container {

            position: relative;

            width: 800px;
            height: 450px;

        }

        .video {

            display: block;

            width: 800px;
            height: 450px;

        }

        .canvas {

            position: absolute;

            top: 0;
            left: 0;

            width: 800px;
            height: 450px;

            cursor: crosshair;

        }

        button {

            margin-top: 10px;
            margin-right: 5px;

            padding: 8px 15px;

        }

        .info {

            margin: 10px 0;

            font-size: 18px;

        }

    </style>

</head>


<body>


<h1>Gestion des files d'attente</h1>


<div class="cameras">


    <!-- ================================================= -->
    <!-- CAMERA 1 -->
    <!-- ================================================= -->

    <div class="camera">

        <h2>Caméra 1</h2>

        <div class="info">

            Personnes détectées :

            <span id="person-count-1">
                0
            </span>

        </div>


        <div class="video-container">

            <img
                id="video-1"
                class="video"
                src="/video/1"
            >

            <canvas
                id="canvas-1"
                class="canvas"
                width="800"
                height="450"
            ></canvas>

        </div>


        <p>

            Nombre de points :

            <span id="count-1">
                0
            </span>

        </p>


        <button
            id="validate-1"
        >
            Valider la zone
        </button>


        <button
            id="clear-1"
        >
            Effacer la zone
        </button>


        <p id="result-1"></p>

    </div>



    <!-- ================================================= -->
    <!-- CAMERA 2 -->
    <!-- ================================================= -->

    <div class="camera">

        <h2>Caméra 2</h2>

        <div class="info">

            Personnes détectées :

            <span id="person-count-2">
                0
            </span>

        </div>


        <div class="video-container">

            <img
                id="video-2"
                class="video"
                src="/video/2"
            >

            <canvas
                id="canvas-2"
                class="canvas"
                width="800"
                height="450"
            ></canvas>

        </div>


        <p>

            Nombre de points :

            <span id="count-2">
                0
            </span>

        </p>


        <button
            id="validate-2"
        >
            Valider la zone
        </button>


        <button
            id="clear-2"
        >
            Effacer la zone
        </button>


        <p id="result-2"></p>

    </div>


</div>


<script src="/static/script_test.js"></script>


</body>

</html>
